<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MailMate — Northwind Ltd</title>
<style>
  /* MEASURED, not chosen. This pane is on a projector for the whole of Talk 1
     and --panel was #fff — pure white behind every bubble, the header and the
     footer, which is glare in a dark room. Panels are now 0.904 luminance,
     ~10% off white, and the ground is a light gray so a bubble reads AS a
     bubble (panel/bg was 1.06:1, now 1.10).

     --dim is what limits how far this can go: it is 13px, so it needs 4.5:1
     against the panel and it only had 4.78 to spend. At #697386 a gray panel
     took it to 4.34 — under. Darkened to #5c6678, which holds 5.26 on the new
     panel and 4.76 on the ground. Every other ratio improved:
     fg/panel 18.3 -> 16.6, fg/bg 17.2 -> 15.0, both far above the 4.5 floor.

     --me is untouched: white on #2563eb is 5.17:1 and your own bubble should
     still look like a product's accent colour. */
  :root{--bg:#e6e9f0;--panel:#f2f4f8;--line:#cdd3df;--fg:#12151c;--dim:#5c6678;
        --me:#2563eb;--bot:#dde2ec}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);height:100vh;display:flex;
       flex-direction:column;
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);
         padding:14px 22px;display:flex;align-items:center;gap:12px}
  .logo{width:30px;height:30px;border-radius:8px;background:var(--me);color:#fff;
        display:grid;place-items:center;font-weight:700;font-size:15px}
  h1{font-size:16px;font-weight:650}
  .team{margin-left:auto;color:var(--dim);font-size:13px}
  main{flex:1;overflow-y:auto;padding:22px;display:flex;flex-direction:column;
       gap:14px;max-width:820px;width:100%;margin:0 auto}
  .msg{display:flex;gap:11px;max-width:80%}
  .msg.me{align-self:flex-end;flex-direction:row-reverse}
  .av{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:grid;
      place-items:center;font-size:12px;font-weight:700;background:var(--bot)}
  .msg.me .av{background:var(--me);color:#fff}
  .bub{background:var(--panel);border:1px solid var(--line);border-radius:13px;
       padding:11px 15px;word-break:break-word}
  .msg.me .bub{background:var(--me);color:#fff;border-color:var(--me)}
  .bub img{max-width:100%;border-radius:7px;margin-top:6px;display:block}
  footer{background:var(--panel);border-top:1px solid var(--line);padding:14px 22px}
  .row{display:flex;gap:10px;max-width:820px;margin:0 auto}
  input{flex:1;padding:11px 15px;border:1px solid var(--line);border-radius:10px;
        font:inherit;background:var(--bg)}
  input:focus{outline:2px solid var(--me);outline-offset:-1px}
  button{padding:11px 20px;border:0;border-radius:10px;background:var(--me);
         color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  .hint{max-width:820px;margin:8px auto 0;color:var(--dim);font-size:12px}
</style>
</head>
<body>
  <header>
    <div class="logo">M</div>
    <h1>MailMate <span style="font-weight:400;color:var(--dim)">· Northwind Ltd</span></h1>
    <div class="team">team <b>__TEAM__</b></div>
  </header>

  <main id="log">
    <div class="msg">
      <div class="av">M</div>
      <div class="bub">Morning. I can read the support inbox, look things up in
        the workspace, and draft replies. What do you need?</div>
    </div>
  </main>

  <footer>
    <div class="row">
      <input id="q" placeholder="Ask MailMate…" autocomplete="off">
      <button id="send">Send</button>
    </div>
    <div class="hint">Replies render markdown, including images.</div>
  </footer>

<script>
const TEAM = "__TEAM__";

/* =====================================================================
   DELIBERATE VULNERABILITY — DO NOT "FIX":
     Remote image fetching. The <img> tags below MUST hit the network.
     Workshop 1 exercises 5 and 7, and Talk 1 demo 3, all depend on the
     BROWSER making that request. Remove it and those exercises silently
     do nothing — thirty people conclude they're bad at this.

     BOTH markdown forms are required. Inline ![alt](url) AND reference
     style ![alt][ref] + [ref]: url. EchoLeak used the reference form, and
     link-redaction logic misses it. Inline-only makes exercise 5's bonus
     unachievable and leaves the EchoLeak line in Talk 1 with nothing
     behind it.

   INCIDENTAL, NOT PART OF THE LESSON:
     alt/src are escaped below. Model output is attendee-controlled, so
     unescaped interpolation would be an HTML injection that has nothing
     to do with what we're teaching. Escaping it does NOT affect any
     exercise. Keep the fetch; keep the escaping.
   ===================================================================== */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                          .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* THE FETCH IS UNTOUCHED — this rewrites the HOST LABEL ONLY, to the same
   server the page came from. Read the DELIBERATE VULNERABILITY block above:
   it is still true, the browser still makes the request, and exercises 5 and 7
   and Talk 1 demo 3 still depend on it.

   WHY: measured on real conference wifi — the venue AP blocked mDNS, so
   `northwind.local` does not resolve on an ATTENDEE'S laptop — only in here,
   via Docker's DNS, and on the presenter's Mac. A payload that names it
   therefore rendered a 🖼 and an empty scoreboard for every attendee on the
   notebook path, which is indistinguishable from a bad payload.

   This is the rewrite eval_workshop1.render_like_the_chat_pane() has always
   done (`u.replace("http://northwind.local", LAB)`) — so the browser now
   behaves like the harness the ex5/ex7 rates were measured with. No payload
   byte changes anywhere.

   location.origin, not a hard IP: the venue DHCP lease is 3 hours. Opened from
   northwind.local or localhost — which is how Talk 1 runs — it is a no-op. */
function exfilSrc(u) {
  return u.replace(/^http:\/\/northwind\.local(?=[\/:]|$)/i, location.origin);
}

function render(md) {
  let out = esc(md);

  // 1. reference definitions:  [ref]: http://...
  const refs = {};
  out = out.replace(/^\s*\[([^\]]+)\]:\s*(\S+)\s*$/gm, (_, k, u) => {
    refs[k.toLowerCase()] = u;
    return '';
  });

  // 2. reference-style images:  ![alt][ref]   <-- the EchoLeak form
  out = out.replace(/!\[([^\]]*)\]\[([^\]]+)\]/g, (m, alt, k) => {
    const u = refs[k.toLowerCase()];
    return u ? `<img src="${exfilSrc(u)}" alt="${alt}" onerror="this.replaceWith('🖼')">` : m;
  });

  // 3. inline images:  ![alt](http://...)
  out = out.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,
    (m, alt, u) => `<img src="${exfilSrc(u)}" alt="${alt}" onerror="this.replaceWith('🖼')">`);

  return out.replace(/\n/g, '<br>');
}

const log = document.getElementById('log');
const q   = document.getElementById('q');
const send= document.getElementById('send');

function bubble(text, mine) {
  const d = document.createElement('div');
  d.className = 'msg' + (mine ? ' me' : '');
  d.innerHTML = `<div class="av">${mine ? 'You' : 'M'}</div>
                 <div class="bub">${mine ? esc(text) : render(text)}</div>`;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}

async function ask() {
  const text = q.value.trim();
  if (!text) return;
  q.value = ''; send.disabled = true;
  bubble(text, true);
  const wait = document.createElement('div');
  wait.className = 'msg';
  wait.innerHTML = '<div class="av">M</div><div class="bub">…</div>';
  log.appendChild(wait);
  try {
    const r = await fetch(`/api/${encodeURIComponent(TEAM)}/ask`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message: text}),
    });
    const j = await r.json();
    wait.remove();
    bubble(j.reply || '(no reply)', false);
  } catch (e) {
    wait.remove();
    bubble('Sorry — the assistant is unreachable right now.', false);
  }
  send.disabled = false; q.focus();
}

send.onclick = ask;
q.addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
q.focus();
</script>
</body>
</html>
