# AI Village lab — single entry point.
#
# Every upstream is referenced through a VARIABLE (set $up ...). That forces
# nginx to resolve the name at request time rather than at startup, which means
# nginx starts fine when a service doesn't exist yet and returns 502 for just
# that route. Without this, one missing container stops the whole proxy from
# booting — and during the build most containers are missing.
#
# Prefix stripping is done with `rewrite ... break` rather than a URI on
# proxy_pass, because proxy_pass does not do the automatic prefix rewrite when
# the upstream is a variable.

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # uploads are base64 in a JSON body — 33% inflation over the 64 MB cap
    client_max_body_size 128m;

    access_log /var/log/nginx/access.log;

    # ---- nginx's own liveness. Answers even when everything else is down.
    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- fake hub -----------------------------------------------------------
    # HF_ENDPOINT=http://northwind.local/hub  →  prefix stripped before it hits :8000
    location /hub/ {
        set $up hub;
        rewrite ^/hub/?(.*)$ /$1 break;
        proxy_pass http://$up:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # model files can be large; don't buffer them through disk
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ---- sleeper inference (Workshop 2 exercise 8 — OPTIONAL APPENDIX) ------
    # Nothing listens here unless you have built the model yourself; see
    # sleeper/README.md. The workshop's other 7 exercises do not need it.
    #
    # The model server runs NATIVELY on the host, not in a container: on Apple
    # Silicon mlx_lm needs Metal, which Docker cannot pass through. Start it
    # with `make sleeper`.
    #
    # LITERAL upstream, not the `set $up` pattern used everywhere else on this
    # page. host.docker.internal resolves to an IPv6 address, and the resolver
    # at the top is ipv6=off, so the variable form silently fails to resolve.
    # A literal name is resolved ONCE AT STARTUP from /etc/hosts — which is why
    # the nginx service carries extra_hosts: host-gateway in docker-compose.yml.
    # Without it the name does not resolve on Docker Engine and nginx refuses to
    # start, taking the whole lab down rather than just this route.
    location /sleeper/ {
        proxy_pass http://host.docker.internal:8081/;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 600s;       # CPU generation is slower than Metal

        # Turn "not installed" into something the page can READ. Without this
        # /w2 gets a 502 and shows "grab an instructor", which is useless to
        # someone running this alone at home.
        proxy_intercept_errors on;
        error_page 502 503 504 = @sleeper_absent;
    }

    location @sleeper_absent {
        default_type application/json;
        return 200 '{"error":"sleeper_not_installed","see":"sleeper/README.md"}';
    }

    # ---- listener -----------------------------------------------------------
    location = /pwned {
        set $up listener;
        proxy_pass http://$up:8002;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /feed {
        set $up listener;
        proxy_pass http://$up:8002;
    }

    location /img/ {
        set $up listener;
        proxy_pass http://$up:8002;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header User-Agent $http_user_agent;
    }

    # ---- victim bot status + per-team load log (Workshop 2 ex 6) ------------
    location = /victim/log {
        set $up victim;
        rewrite ^ /log break;
        proxy_pass http://$up:8006;
    }

    location = /teardown {
        set $up listener;
        proxy_pass http://$up:8002;
    }

    # ---- mailmate (not built yet — 502 until it is) -------------------------
    location /chat/ {
        set $up mailmate;
        proxy_pass http://$up:8001;
        proxy_set_header Host $host;
    }

    location /actions/ {
        set $up mailmate;
        proxy_pass http://$up:8001;
        proxy_set_header Host $host;
    }

    location /api/ {
        set $up mailmate;
        proxy_pass http://$up:8001;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;          # inference can be slow under load
    }

    # ---- scanner (not built yet) --------------------------------------------
    location = /scan {
        set $up scanner;
        proxy_pass http://$up:8004;
        proxy_read_timeout 60s;
    }

    location = /scan/upgrade {
        set $up scanner;
        proxy_pass http://$up:8004;
    }

    location = /scan/health {
        set $up scanner;
        rewrite ^ /health break;
        proxy_pass http://$up:8004;
    }

    # ---- mailpit UI (not built yet). MP_WEBROOT=/mail/ keeps assets working.
    location /mail/ {
        set $up mailsink;
        proxy_pass http://$up:8025;
        proxy_set_header Host $host;
        # Mailpit pushes new mail to its UI over a WebSocket. Without these the
        # handshake fails and the sink NEVER updates on its own — measured
        # 1 Sept: a real send_mail landed (API total 4 -> 5) and the open page
        # still read "1-4 of 4" three seconds later. That is the cold open's
        # entire beat, and the fallback is reloading the page in front of the
        # room, which says "I went and fetched this" instead of "it just
        # happened". proxy_http_version matters as much as the headers: nginx
        # talks 1.0 upstream by default and a 1.0 request cannot be upgraded.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;      # the socket is idle between demos
    }

    # ---- shellbox (Workshop 2 exercise 7, web path) -------------------------
    location /shell/ {
        set $up shellbox;
        proxy_pass http://$up:8007;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # ---- attendee front door + the no-notebook workshop pages ---------------
    # Static files, served by nginx itself. Deliberately NOT behind a service:
    # this is the page that tells someone how to get in, so it must still work
    # when something else is down. `alias` on an exact-match location maps the
    # URL straight to one file.
    #
    # These exist because the room is not all Python people. /w1 and /w2 drive
    # the same APIs the notebooks do and score identically — see lab/www/.
    # default_type is NOT optional here. nginx picks the MIME type from the
    # REQUEST URI, not from the alias target — and /start has no extension, so
    # it falls back to application/octet-stream and the browser DOWNLOADS the
    # page instead of rendering it. Extensionless URLs + alias always need this.
    #
    # no-store is deliberate. These are edited on the day, and a browser that
    # cached one bad response keeps serving it: while the Content-Type bug
    # above was live, Chrome cached the octet-stream reply and went on OFFERING
    # THE PAGE AS A DOWNLOAD after nginx was fixed. Safari, which never loaded
    # it while it was broken, was fine. Three small pages — don't cache them.
    location = /start { alias /usr/share/nginx/www/start.html; default_type text/html; charset utf-8; add_header Cache-Control "no-store"; }
    location = /w1    { alias /usr/share/nginx/www/w1.html;    default_type text/html; charset utf-8; add_header Cache-Control "no-store"; }
    location = /w2    { alias /usr/share/nginx/www/w2.html;    default_type text/html; charset utf-8; add_header Cache-Control "no-store"; }
    # Hints and starter documents for /w1, extracted from the notebooks by
    # `make webcontent`. Never hand-authored — see scripts/build_web_content.py.
    location = /w1-content.json { alias /usr/share/nginx/www/w1-content.json; default_type application/json; charset utf-8; add_header Cache-Control "no-store"; }
    location = /w2-content.json { alias /usr/share/nginx/www/w2-content.json; default_type application/json; charset utf-8; add_header Cache-Control "no-store"; }

    # ---- everything else: the scoreboard ------------------------------------
    location / {
        set $up scoreboard;
        proxy_pass http://$up:8003;
        proxy_set_header Host $host;
    }
}
